name: setup-sqlite
description: >-
  Install the sqlite3 CLI (and optionally sqldiff) on the runner. This is the
  canonical home of the ubuntu apt block and the macOS keg-only brew
  workaround that previously existed as near-copies across ci.yml and
  nightly.yml — edit here, not at the call sites. Call sites that differ in
  the sqldiff input carry a one-line comment saying why.

inputs:
  sqldiff:
    description: >-
      Also install sqldiff ('true'/'false'). offshoot diff's default
      (non --summary) mode needs sqldiff on PATH; jobs that never exercise
      diff (torture, metrics-lint, sdks) leave this off.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install sqlite3 CLI (ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      env:
        SQLDIFF: ${{ inputs.sqldiff }}
      run: |
        sudo apt-get update
        if [ "$SQLDIFF" = "true" ]; then
          # sqlite3-tools is a SEPARATE package from sqlite3 (verified against
          # the ubuntu-latest image: `apt-cache show sqlite3-tools` lists
          # /usr/bin/sqldiff, /usr/bin/sqlite3_analyzer, /usr/bin/sqlite3_rsync)
          # — offshoot diff's default (non --summary) mode needs sqldiff on
          # PATH; the CLI tests that exercise it (cmd/offshoot/diff_test.go)
          # gate on exec.LookPath("sqldiff") the same way requireSQLite3
          # gates on sqlite3 itself, so this install is what turns those
          # tests on in CI rather than silently skipping them.
          sudo apt-get install -y sqlite3 sqlite3-tools
        else
          sudo apt-get install -y sqlite3
        fi

    - name: Install sqlite3 CLI (macos)
      if: runner.os == 'macOS'
      shell: bash
      env:
        SQLDIFF: ${{ inputs.sqldiff }}
      run: |
        # The macos-26 runner image (macos-latest since 2026-07) no longer
        # ships the sqlite3 CLI on PATH — earlier images did, and this step's
        # absence only bit when macos-latest rolled forward. brew's sqlite
        # is keg-only, so link the binaries onto PATH explicitly; the
        # `sqldiff` formula provides offshoot diff's default mode.
        if [ "$SQLDIFF" = "true" ]; then
          brew install sqlite sqldiff || true
        else
          brew install sqlite || true
        fi
        echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"
