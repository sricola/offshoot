version: 2
updates:
  # The workflows SHA-pin every action (supply-chain: immune to tag
  # rewrites); this is what keeps those pins from rotting — Dependabot PRs
  # bump the pinned SHA and its trailing `# vX.Y.Z` comment together.
  #
  # Grouped: one PR per ecosystem per week instead of one per dependency.
  # The AWS SDK alone is five modules that move in lockstep (aws-sdk-go-v2,
  # config, service/s3, smithy-go, plus indirects), and every ungrouped PR
  # re-rebases the others as they merge, so a weekly cycle used to arrive
  # as ten PRs that each needed a CI run and a rebase. One PR, one CI run,
  # one review, one commit on main.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  # The Dockerfile pins both base images by digest (`image:tag@sha256:...`);
  # this bumps the digest when the tag's image is rebuilt upstream (security
  # patches to bookworm / the Go toolchain), the same way the actions entry
  # above keeps SHA pins from rotting.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  # The TypeScript SDK's dev dependencies (typescript, @types/node) via its
  # package-lock.json; the SDK has no runtime dependencies.
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      ts-sdk-dev:
        patterns: ["*"]

  # The hash-pinned Python locks CI installs with --require-hashes
  # (requirements/*.txt, compiled from the .in beside each). A bump PR here
  # must keep every hash; CONTRIBUTING.md documents the uv regenerate
  # command if a PR arrives without them.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    groups:
      python-ci-locks:
        patterns: ["*"]
