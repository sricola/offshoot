name: ci

on:
  push:
    branches: [main]
    # Prose-only pushes (docs, site, packaging metadata) don't need the Go
    # matrix — a large share of pushes are exactly these, and each full run
    # was billing real minutes for zero signal.
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**.md"
      - "Formula/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**.md"
      - "Formula/**"
      - "LICENSE"

# Rapid successive pushes to the same ref supersede each other — cancel the
# stale run instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS is deliberately absent here: GitHub bills macOS runners at 10x,
  # and the per-push macOS leg was the single largest line in the Actions
  # bill. macOS coverage now lives in nightly.yml's weekly leg (full
  # `go test ./...` + torture on macos-latest) and in every release build.
  # Linux catches everything platform-independent; the known macOS-specific
  # breakages (sqlite3 CLI missing from the image, reflink/clonefile paths)
  # are exercised weekly and at every tag. The macOS sqlite3/brew install
  # logic itself lives in .github/actions/setup-sqlite (consumed by
  # nightly.yml's macos-test), so re-adding macOS to this matrix is a
  # one-line change — no dead macOS step is kept here.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # sqldiff on: cmd/offshoot/diff_test.go exercises offshoot diff's
      # default (sqldiff-backed) mode in this job — see the composite action
      # for the full rationale.
      - uses: ./.github/actions/setup-sqlite
        with:
          sqldiff: "true"

      - name: Verify sqlite3 CLI is present
        run: sqlite3 --version && sqldiff --help >/dev/null

      - name: gofmt
        # Fails when gofmt would rewrite any file (offenders are printed);
        # keeps an unformatted file — test or not — from shipping silently
        # (make lint runs the same check locally).
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # GitHub Actions sets CI=true, which arms testutil.RequireExec: if the
      # sqlite3/sqldiff installs above ever break, the affected tests hard-fail
      # here instead of silently skipping the integration suite green.
      - name: go test
        run: go test ./... -count=1 -race

  # metrics-lint is Milestone 4 PM Amendment 7's hard gate: promtool (the
  # Prometheus project's own exposition-format linter) run against a real
  # WritePrometheus dump of this daemon's locked metric list (see
  # internal/metrics/metrics_test.go's TestPromtoolCheckMetrics and
  # internal/daemon/metrics_test.go's TestPromtoolCheckRealMetrics — both
  # skip loudly, not silently, when promtool isn't on PATH, which is exactly
  # the case this job exists to close). promtool ships only as a binary
  # inside Prometheus's own release tarball, not as a Go module, so it can't
  # be `go install`'d — downloaded directly from the pinned release below.
  # A separate job (not folded into `test` above) because it needs an extra
  # download step irrelevant to every other test and should be independently
  # rerunnable/cacheable.
  metrics-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # No sqldiff: nothing in the promtool gate touches offshoot diff.
      - uses: ./.github/actions/setup-sqlite

      # Pinned version AND checksum, not "latest": a promtool release
      # changing its check rules out from under this job should be a
      # deliberate version bump here, not a silent, unreviewed CI behavior
      # change — and release assets are replaceable upstream without the URL
      # changing, so the sha256 is what actually freezes the bits.
      - name: Install promtool
        run: |
          set -euo pipefail
          ver=3.13.2
          # sha256 of prometheus-3.13.2.linux-amd64.tar.gz, cross-checked
          # against the v3.13.2 release's published sha256sums.txt. Bump the
          # version and this hash together.
          sha256=0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz"
          if ! echo "${sha256}  /tmp/prometheus.tar.gz" | sha256sum -c -; then
            echo "promtool tarball sha256 mismatch (expected ${sha256}) — refusing to extract" >&2
            exit 1
          fi
          tar -xzf /tmp/prometheus.tar.gz -C /tmp "prometheus-${ver}.linux-amd64/promtool"
          sudo mv "/tmp/prometheus-${ver}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: promtool check metrics
        # OFFSHOOT_REQUIRE_PROMTOOL arms testutil.RequirePromtool's hard-fail
        # path: if the pinned install above ever breaks or is removed, these
        # tests fail instead of skipping and letting the gate go green. (Bare
        # CI=true can't be the trigger for promtool: the main `test` job runs
        # `go test ./...` without promtool by design, skipping these loudly.)
        env:
          OFFSHOOT_REQUIRE_PROMTOOL: "1"
        run: go test ./internal/metrics ./internal/daemon -run TestPromtoolCheck -v -count=1

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify system python3 is present
        run: python3 --version

      # No sqldiff: the SDK suites drive the daemon, never offshoot diff.
      - uses: ./.github/actions/setup-sqlite

      - name: make test-sdks
        run: make test-sdks

      # test-pytest-plugin exercises the offshoot.pytest_plugin fixture plugin
      # (the `offshoot-db[pytest]` extra) — its own suite, separate from
      # test-sdks above, because it genuinely needs pytest + pytest-xdist
      # installed (unlike the plain-unittest suites test-sdks just proved
      # pass WITHOUT pytest on PATH — see Milestone 3 Task 4's status.md
      # row for why that separation is load-bearing: the base SDK must stay
      # stdlib-only). Installed editable so its `pytest11` entry point
      # registration is exercised for real, exactly as an installed
      # `offshoot-db[pytest]` would be.
      #
      # A venv, NOT `pip install --break-system-packages` straight onto
      # system python: this runner is non-root/no-sudo, so PEP 668's
      # externally-managed guard plus --break-system-packages makes pip
      # silently fall back to a *user*-site install
      # (~/.local/lib/pythonX.Y/site-packages) — which is only importable
      # via $HOME. That's fine for the outer `make test-pytest-plugin`
      # process itself, but three of its tests use pytest's own `pytester`
      # fixture in *subprocess* mode (`runpytest_subprocess`, needed for a
      # real xdist -n2 run, a real cwd-vs-rootdir check, and a real -W
      # error flag) — and `pytester` deliberately repoints HOME at a
      # throwaway tmp dir for every nested run (see _pytest/pytester.py's
      # Pytester.__init__, "Ensure no user config is used"). With pytest
      # installed only under the REAL $HOME, that nested subprocess can no
      # longer find it at all: it exits with "No module named pytest"
      # before printing a terminal summary, which pytester.py:585 surfaces
      # as "ValueError: Pytest terminal summary report not found". A venv's
      # site-packages path is baked into the interpreter itself, independent
      # of $HOME, so the nested subprocess (same interpreter, same venv)
      # keeps seeing pytest regardless of what HOME it's given — the same
      # reason this never reproduces in a local dev venv.
      - name: Install offshoot-db[pytest] + pytest-xdist
        run: |
          python3 -m venv .venv-pytest-plugin
          .venv-pytest-plugin/bin/pip install --quiet -e "sdk/python[pytest]" pytest-xdist

      - name: make test-pytest-plugin
        run: PATH="$PWD/.venv-pytest-plugin/bin:$PATH" make test-pytest-plugin

      # The LangGraph companion intentionally keeps the full framework out of
      # its runtime dependencies: it only imports checkpoint interfaces. Its
      # end-to-end suite does compile a real StateGraph, so install the
      # package's explicit [test] extra in a separate venv and arm the strict
      # no-skip path through the Make target. Installing sdk/python alongside
      # it satisfies offshoot-db from this checkout while that package remains
      # intentionally unpublished.
      - name: Install LangGraph companion test environment
        run: |
          python3 -m venv .venv-langgraph
          .venv-langgraph/bin/pip install --quiet \
            -e sdk/python -e "sdk/python-langgraph[test]"

      - name: make test-python-langgraph
        run: PATH="$PWD/.venv-langgraph/bin:$PATH" make test-python-langgraph

      # dry-run-sdks builds the real sdist/wheel and npm tarball, runs twine
      # check, and install-tests both — the same build-verification tier
      # .github/workflows/publish.yml runs in dry-run mode (PUBLISH_ENABLED
      # off) or right before a real upload (PUBLISH_ENABLED on). Running it
      # here, on every PR, is the simplest way to prove the SDKs still
      # build and install correctly without duplicating any of publish.yml's
      # upload logic or adding a second trigger to reason about — see
      # publish.yml's top comment for the fuller rationale. --break-system-
      # packages is needed because Ubuntu's system python3 (PEP 668) refuses
      # a bare `pip install`; this is an ephemeral CI container, not a dev
      # machine, so that's the right call here (contrast: publish.yml's own
      # jobs use actions/setup-python, which isn't externally managed and
      # doesn't need this flag).
      - name: Install SDK build/publish check tooling
        run: python3 -m pip install --break-system-packages --quiet build twine

      - name: make dry-run-sdks
        run: make dry-run-sdks

  s3-conformance:
    runs-on: ubuntu-latest
    # MinIO is started with a plain `docker run` (see "Start MinIO" below)
    # rather than a `services:` container: the job-level services schema has
    # no way to pass `server /data` as the container command without
    # replacing the image's entrypoint, and `docker run ... minio/minio
    # server /data` is exactly the invocation the README's supported-provider
    # table cites as verified, so this keeps CI matching that evidence. The
    # only CI-side deviation: both images are digest-pinned (immutable)
    # instead of `:latest`, so a replaced upstream tag can't silently change
    # what runs next to the checkout.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Start MinIO
        # Digest = what minio/minio:latest resolved to when last reviewed
        # (# minio:RELEASE.2025-09-07T16-13-09Z). Bump deliberately, together
        # with the mc digest below.
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio is up"
              break
            fi
            sleep 1
          done
          curl -sSf http://127.0.0.1:9000/minio/health/live

      - name: Create test bucket
        # Digest = minio/mc:latest at last review (# mc:RELEASE.2025-08-13T08-35-41Z).
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 mb -p local/offshoot-test

      - name: make test-s3
        env:
          OFFSHOOT_S3_TEST_BUCKET: offshoot-test
          OFFSHOOT_S3_ENDPOINT: http://127.0.0.1:9000
          OFFSHOOT_S3_PATH_STYLE: "1"
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: make test-s3

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true
