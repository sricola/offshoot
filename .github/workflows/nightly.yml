name: nightly

on:
  schedule:
    # 09:00 UTC Monday–Saturday — the cheap daily leg (ubuntu torture +
    # conformance), and it skips itself when main hasn't moved since the
    # last run. Sunday is deliberately excluded: the weekly cron below is
    # the only 09:00 Sunday run, so the two schedules can never double-fire
    # (previously `* * *` made Sunday bill the ubuntu torture leg twice).
    - cron: "0 9 * * 1-6"
    # 09:00 UTC Sunday — the expensive weekly leg (macOS at 10x billing:
    # full `go test ./...` + torture). This is where the macOS coverage
    # removed from ci.yml's per-push matrix now lives. This exact cron
    # string is compared in ONE place — the activity job's `weekly` output
    # below — keep the two byte-for-byte identical.
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip the whole nightly when main hasn't moved since the last scheduled
  # window: a quiet repo shouldn't bill daily torture runs for a tree that
  # already passed yesterday. One tiny ubuntu job (seconds) makes that call.
  # workflow_dispatch and the weekly leg always run regardless.
  activity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.check.outputs.fresh }}
      # weekly=true selects the expensive leg (macOS torture + full macOS
      # `go test`): the Sunday cron, and every manual dispatch. Computed
      # here, ONCE — torture's matrix ternary and macos-test's `if` consume
      # this output instead of re-comparing the cron string, so the string
      # lives in exactly two places (on.schedule + the one comparison below).
      weekly: ${{ steps.check.outputs.weekly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # The literal below must match the Sunday cron in on.schedule
          # byte-for-byte — this is the ONLY place it is compared; every
          # other job consumes the `weekly` output instead.
          weekly=false
          if [ "$EVENT_NAME" != "schedule" ] || [ "$EVENT_SCHEDULE" = "0 9 * * 0" ]; then
            weekly=true   # manual dispatch and the Sunday leg
          fi
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"

          if [ "$weekly" = "true" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"   # manual runs and the weekly leg never skip
          elif [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "No commits on main in the last 25h; skipping the nightly torture run."
          fi

  torture:
    needs: activity
    # Daily cron: ubuntu only (1x billing). Weekly Sunday cron + manual
    # dispatch (activity's weekly=true): both OSes — the macOS torture leg
    # (10x billing) that used to run daily now runs weekly, alongside the
    # full macOS `go test` below.
    if: github.ref == 'refs/heads/main' && needs.activity.outputs.fresh == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ needs.activity.outputs.weekly == 'true' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # No sqldiff on either OS: torture never exercises offshoot diff.
      - uses: ./.github/actions/setup-sqlite

      # If the install breaks, fail here — and testutil.RequireSQLite3
      # would hard-fail the tests anyway (CI=true), never silently skip.
      - name: Verify sqlite3 CLI is present
        run: sqlite3 --version

      - name: make test-torture
        run: make test-torture

  # Go native fuzzing of the parsers that read untrusted bytes (store
  # names, LTX snapshot/segment decode, the .sum sidecar, the daemon
  # request decoder). Daily leg, ubuntu only. `-fuzz` takes one target per
  # package run, so the targets run sequentially, 60s each; every target
  # runs even after one fails, and the job then fails. A crasher is written
  # under the package's testdata/fuzz/<Target>/ and uploaded so it can be
  # reproduced locally with `go test ./internal/<pkg> -run '<Target>/<id>'`.
  fuzz:
    needs: activity
    if: github.ref == 'refs/heads/main' && needs.activity.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fuzzing runs on the newest Go minor, not go.mod's 1.26.0 floor (ci.yml
      # keeps testing the floor). Go 1.26's fuzz coordinator can report
      # "context deadline exceeded" as the test's failure when -fuzztime
      # expires while a worker is mid-input (go.dev/issue/75804, fixed in
      # 1.27.0); the 2026-10-03 run failed FuzzDecodeSnapshot that way with no
      # crasher.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'

      # Same loop as `make fuzz` (30s there). -fuzzminimizetime caps how
      # long each new corpus entry is minimized, which otherwise eats most
      # of a short budget on the LTX targets; a crasher is saved either way.
      - name: go test -fuzz (60s per target)
        run: |
          failed=""
          for spec in store:FuzzValidateName ltxio:FuzzDecodeSnapshot ltxio:FuzzApplySegments ops:FuzzReadSidecar daemon:FuzzDecodeRequest; do
            pkg="${spec%%:*}"; target="${spec##*:}"
            echo "::group::$target (internal/$pkg)"
            if ! go test "./internal/$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 60s -fuzzminimizetime 5s; then
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed (crashers uploaded as the fuzz-crashers artifact)"
            exit 1
          fi

      - name: Upload crashers
        # failure() alone skips this when the job hits timeout-minutes (the
        # job is then cancelled, not failed), and any crashers already saved
        # would be lost with it.
        if: failure() || cancelled()
        # actions/upload-artifact v7.0.1: refs/tags/v7.0.1 is a lightweight
        # tag pointing straight at commit 043fb46 (same pin as scorecard.yml).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore

  # The full macOS test suite (the coverage removed from ci.yml's per-push
  # matrix, where its 10x billing dominated the Actions bill): weekly
  # Sunday leg and manual dispatch only (activity's weekly output).
  # Linux reflink: the copy-on-write fast paths (by-chain clones, checkpoint
  # shadows, segment checkpoints) run on APFS in ci.yml's cow-paths job and
  # nowhere else; Linux FICLONE (btrfs, XFS with reflink) was supported but
  # never exercised. ubuntu-latest's root filesystem cannot clone, so this
  # job builds a loopback XFS image with reflink=1, points TMPDIR at it, and
  # applies the same probe gate: if the clone probe skips, the job fails
  # rather than passing on skips. Also runnable by workflow_dispatch on any
  # branch, so a change to this job can be proven before it lands on main.
  linux-reflink:
    needs: activity
    if: ${{ !cancelled() && ((github.ref == 'refs/heads/main' && needs.activity.outputs.fresh == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-sqlite

      - name: Mount a loopback XFS filesystem with reflink enabled
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs >/dev/null
          truncate -s 8G /tmp/xfs-reflink.img
          mkfs.xfs -q -m reflink=1 /tmp/xfs-reflink.img
          sudo mkdir -p /mnt/xfs
          sudo mount -o loop /tmp/xfs-reflink.img /mnt/xfs
          sudo chown "$(id -u):$(id -g)" /mnt/xfs
          mkdir -p /mnt/xfs/tmp
          echo "TMPDIR=/mnt/xfs/tmp" >> "$GITHUB_ENV"
          df -hT /mnt/xfs

      - name: Verify the mount clones (FICLONE)
        run: |
          set -o pipefail
          go test ./internal/reflink -run '^TestCloneProducesIdenticalFile$' -count=1 -v | tee reflink-probe.txt
          if grep -q -- '--- SKIP' reflink-probe.txt; then
            echo "TMPDIR cannot clone on this mount; the copy-on-write tests would all skip" >&2
            exit 1
          fi

      - name: go test (copy-on-write paths, Linux reflink)
        run: go test ./internal/ops ./internal/ltxio ./internal/reflink -count=1

      - name: go test (copy-on-write session opens, Linux reflink)
        run: go test ./internal/session -run '^(TestOpenOnClonedCheckoutSkipsSettlingFlush|TestAtRestCheckpointAfterCloseWritesASegment)$' -count=1 -v

  # perf-ab alternates cmd/branchbench built from the latest tag with one
  # built from this commit on the same runner, four rounds per workflow
  # (cmd/bench-ab's default). The job fails on a gating regression (exit 1:
  # fork, checkout or checkpoint p50; wall and eval are informational and
  # never fail it) or on a tool error (exit 2: bad flags, unknown ref, a
  # build, run, parse or timeout failure). A gating metric regressed when
  # its after median exceeds its before median by more than 15% AND every
  # after run sits above every before run — two separate conditions, both
  # required. This is how the v0.2.16 per-checkpoint regression was found by
  # hand three releases late; the job runs the same comparison against the
  # last release on fresh weekdays, on the Sunday leg (fresh is forced true)
  # and on manual dispatches. Also runnable by workflow_dispatch on any
  # branch, so a change to this job can be proven before it lands on main
  # (same shape as linux-reflink above).
  perf-ab:
    needs: activity
    if: ${{ !cancelled() && ((github.ref == 'refs/heads/main' && needs.activity.outputs.fresh == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: bench-ab against the latest tag
        run: |
          # --match 'v[0-9]*' restricts this to release tags: a stray
          # non-release tag near HEAD (release.yml used to leave one behind
          # on a dispatch; dev-329fc05 is still reachable from main) would
          # otherwise silently become the baseline instead of the last
          # release.
          before="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$before" ]; then
            echo "::notice::no release tag reachable; bench-ab has nothing to compare against"
          fi
          mkdir -p bench-ab-out
          # Build, then run the binary: go run folds every non-zero exit
          # into 1, which would hide the 1 (regression) / 2 (tool error)
          # split. RUNNER_TEMP keeps the binary out of the checkout, so it
          # cannot mark the after side -dirty.
          go build -o "$RUNNER_TEMP/bench-ab" ./cmd/bench-ab
          "$RUNNER_TEMP/bench-ab" -before "$before" -run-timeout 10m -out bench-ab-out

      # Keep the raw per-run output even when the job above failed or timed
      # out, so a regression or a stuck run can be diagnosed from the
      # artifact instead of only the (possibly truncated) log. Only the raw
      # per-run logs and the rendered report are uploaded; the extracted
      # before-tag source tree and the two branchbench binaries are not
      # worth 30 days of retention. if-no-files-found is set to ignore
      # because the no-tag case above leaves bench-ab-out empty.
      - name: Upload bench-ab output
        if: always()
        # actions/upload-artifact v7.0.1: refs/tags/v7.0.1 is a lightweight
        # tag pointing straight at commit 043fb46 (same pin as scorecard.yml
        # and the fuzz job above).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-ab
          path: |
            bench-ab-out/raw-*.txt
            bench-ab-out/report.md
          if-no-files-found: ignore
          retention-days: 30

  macos-test:
    needs: activity
    if: github.ref == 'refs/heads/main' && needs.activity.outputs.fresh == 'true' && needs.activity.outputs.weekly == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # sqldiff on: this full `go test ./...` includes cmd/offshoot's diff
      # tests — the same coverage ci.yml's ubuntu test job gets.
      - uses: ./.github/actions/setup-sqlite
        with:
          sqldiff: "true"
      - name: Verify CLIs present
        run: sqlite3 --version && sqldiff --help >/dev/null
      - name: go test
        run: go test ./... -count=1

  real-provider-conformance:
    # This job exercises a real cloud object store (AWS S3)
    # using credentials from repo secrets, which most forks and even most
    # of this repo's own history won't have configured. Gate it on a repo
    # variable so it skips cleanly instead of failing the nightly run when
    # unconfigured.
    needs: activity
    if: github.ref == 'refs/heads/main' && vars.NIGHTLY_S3 == 'true' && needs.activity.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: make test-s3 (real provider)
        env:
          OFFSHOOT_S3_TEST_BUCKET: ${{ secrets.OFFSHOOT_S3_TEST_BUCKET }}
          OFFSHOOT_S3_ENDPOINT: ${{ secrets.OFFSHOOT_S3_ENDPOINT }}
          OFFSHOOT_S3_REGION: ${{ secrets.OFFSHOOT_S3_REGION }}
          OFFSHOOT_S3_PATH_STYLE: ${{ secrets.OFFSHOOT_S3_PATH_STYLE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make test-s3

  real-provider-conformance-skipped:
    # Always-run counterpart to real-provider-conformance so the nightly
    # workflow has a green, visible signal ("skipped gracefully") instead of
    # the job simply not appearing when vars.NIGHTLY_S3 isn't set.
    if: github.ref == 'refs/heads/main' && vars.NIGHTLY_S3 != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (NIGHTLY_S3 not configured)
        run: echo "vars.NIGHTLY_S3 is not 'true'; skipping real-provider conformance."
