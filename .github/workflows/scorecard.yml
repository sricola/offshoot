name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Scorecard reads repo metadata only; the job below elevates exactly what
# publishing results and uploading SARIF need.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload-sarif
      id-token: write          # publish_results signs the result with the workflow's OIDC identity
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo: publishing makes the badge and the scorecard.dev
          # viewer page real. Runs on the default branch only, by the
          # action's own rule.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
