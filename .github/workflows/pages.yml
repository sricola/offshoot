name: pages

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        ".github/workflows/pages.yml",
        "docs/**",
        "sdk/*/README.md",
        "CHANGELOG.md",
        "CONTRIBUTING.md",
        "SECURITY.md",
        "ROADMAP.md",
      ]
  # The same sources on a PR get a build-only run (the `build` job): the
  # generator link-checks every intra-doc link and every docs/**/*.md must
  # be wired into nav.go, so a broken docs change fails the PR instead of
  # the deploy. ci.yml deliberately skips prose-only changes (its Go matrix
  # bills real minutes for no signal there); this one ubuntu job is the
  # docs-PR gate in its place.
  pull_request:
    paths:
      [
        "site/**",
        ".github/workflows/pages.yml",
        "docs/**",
        "sdk/*/README.md",
        "CHANGELOG.md",
        "CONTRIBUTING.md",
        "SECURITY.md",
        "ROADMAP.md",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys stay single-flight under one group; PR builds supersede only
  # their own ref's earlier run.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: site/gen/go.mod
      - name: Build docs site (link check + nav coverage, no deploy)
        run: go -C site/gen run .

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: site/gen/go.mod
      - name: Build docs site
        run: go -C site/gen run .
      - name: Trim non-site files from the artifact
        # The generator sources and the og-card scratch page aren't part of
        # the published site; keep the deployed artifact to exactly what a
        # visitor can be served.
        run: rm -rf site/gen site/og-card.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
