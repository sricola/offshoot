name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: the default token is read-only; the two jobs that
# actually publish (collect → GitHub release, docker → GHCR) elevate
# per-job below. The four build-matrix jobs never need write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          # GitHub retired Intel macOS runners; darwin/amd64 cross-builds on
          # the Apple-silicon runner via clang -arch x86_64 (same-OS cgo
          # cross-arch is supported by Apple's toolchain). Smoke test is
          # skipped for that pairing — arm64 hosts can still run amd64
          # binaries under Rosetta, but runners don't guarantee it.
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve ref name
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (cgo on)
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'cc' }}
          # Ref-derived value: passed via env, NEVER ${{ }}-interpolated into
          # the script — a hostile tag name would otherwise become shell code
          # (expression substitution happens before the shell runs).
          REFNAME: ${{ steps.ref.outputs.name }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${REFNAME}" \
            -o offshoot ./cmd/offshoot

      - name: Smoke test
        # Cross-arch pairings can't execute their binary on the build host;
        # verify the architecture instead.
        env:
          # env, not inline ${{ }} — same expression-injection rationale as
          # the build step above.
          REFNAME: ${{ steps.ref.outputs.name }}
          WANT_GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')" = "$WANT_GOARCH" ]; then
            ./offshoot version
            ./offshoot version | grep -q "$REFNAME"
          else
            file ./offshoot | grep -qi "x86_64\|x86-64"
          fi

      - name: Package
        id: pkg
        env:
          # env, not inline ${{ }} — same expression-injection rationale as
          # the build step above.
          REFNAME: ${{ steps.ref.outputs.name }}
          PKG_GOOS: ${{ matrix.goos }}
          PKG_GOARCH: ${{ matrix.goarch }}
        run: |
          name="offshoot_${REFNAME}_${PKG_GOOS}_${PKG_GOARCH}"
          tar czf "${name}.tar.gz" offshoot
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  collect:
    needs: build
    runs-on: ubuntu-latest
    # The only job that creates the GitHub release — the write scope lives
    # here, not at workflow level. (gh authenticates via the GH_TOKEN env on
    # the release step, not via git credentials, so the checkout below still
    # doesn't need to persist any.)
    permissions:
      contents: write        # gh release create
      id-token: write        # keyless cosign + attestations sign with the job's OIDC identity
      attestations: write    # actions/attest-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate THIRD_PARTY_LICENSES.csv
        run: make third-party-licenses

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List collected assets
        run: ls -la dist THIRD_PARTY_LICENSES.csv

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing identity is this workflow's OIDC token
      # (…/release.yml@refs/tags/vX), recorded in the Rekor transparency
      # log. Verifiers pin that identity, not a key we'd have to guard.
      - name: Sign release tarballs (cosign, keyless)
        run: |
          for f in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          ls -la dist

      - name: SBOM (SPDX JSON, from the Go module graph)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: offshoot_${{ steps.tag.outputs.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SLSA build provenance for the tarballs
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Attach the provenance bundle as a release asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ steps.tag.outputs.name }}
        run: cp "$BUNDLE" "dist/offshoot_${TAG}_provenance.intoto.jsonl"

      - name: SBOM attestation for the tarballs
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: offshoot_${{ steps.tag.outputs.name }}.spdx.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="dev-$(git rev-parse --short HEAD)"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          gh release create "$tag" \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.sigstore.json dist/*.intoto.jsonl \
            offshoot_"$tag".spdx.json THIRD_PARTY_LICENSES.csv \
            --repo "$REPO" \
            --title "$tag" \
            --generate-notes

  docker:
    needs: build
    runs-on: ubuntu-latest
    # The only job that pushes to GHCR — packages: write lives here, not at
    # workflow level.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve ref name
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # The release runner is amd64, so register the arm64 emulator before
      # Buildx. Pin both the action and its binfmt image: a mutable `latest`
      # helper would undercut the workflow's otherwise SHA-pinned supply
      # chain. Digest reviewed 2026-08-16.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ref.outputs.name }}
          # `:latest` moves only on real tag pushes. A workflow_dispatch run
          # is an unreviewed dev build of whatever ref it was dispatched on —
          # it pushes only its dev-<sha> tag, so `docker pull` users can
          # never silently receive one as :latest. (Comma-separated tags;
          # this is an action input, not shell, so expression use is safe.)
          tags: ${{ github.event_name == 'push' && format('ghcr.io/{0}:{1},ghcr.io/{0}:latest', github.repository, steps.ref.outputs.name) || format('ghcr.io/{0}:{1}', github.repository, steps.ref.outputs.name) }}

      # Do not accept a green release whose pushed index silently lacks one
      # of the promised architectures. Attestation manifests may also be in
      # the index, so assert presence rather than an exact manifest count.
      - name: Verify published image platforms
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          '

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image digest (cosign, keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: SLSA build provenance for the image (pushed to GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
