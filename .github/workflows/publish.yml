name: publish

# Publishes the two SDKs (sdk/python -> PyPI, sdk/typescript -> npm) in
# lockstep from one `sdk-v<version>` tag — see CONTRIBUTING.md's "Release
# process" for why lockstep and why one tag, not two.
#
# Gated on the `PUBLISH_ENABLED` repository variable (Settings > Secrets and
# variables > Actions > Variables), which defaults unset/false. While it is
# not exactly "true", BOTH jobs still run in full — building the real
# sdist/wheel and npm tarball, checking them, and install-testing them —
# they just skip the final upload step instead of the whole job. This is
# deliberate: the gate is a publish-authorization switch, not a
# build-verification switch, so flipping it on for the first time is never
# also the first time the build/package steps are exercised.
#
# workflow_dispatch lets a maintainer run the same build-and-check on demand
# without cutting a tag — see ci.yml's sdks job for the other place this
# same check runs (every PR touching sdk/**, via `make dry-run-sdks`, so a
# manifest mistake is caught long before a release tag is ever pushed). A
# workflow_dispatch run is ALWAYS dry-run, unconditionally, even if
# PUBLISH_ENABLED is "true": the pypi/npm jobs' publish steps require the
# run's ref to literally start with refs/tags/sdk-v, which a dispatch run's
# ref never does. This is intentional and load-bearing — see the comment on
# each publish step.
#
# The pypi/npm jobs also each target a GitHub Environment
# (pypi-publish/npm-publish). Both exist with no protection rules until a
# maintainer configures one; adding required reviewers to either (Settings >
# Environments) is an optional, one-click extra gate on top of the
# tag+PUBLISH_ENABLED gate — see CONTRIBUTING.md's Release process, in the
# same user-gated list as claiming the PyPI/npm names.
on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # check resolves the publish gate once and (on a tag push) verifies the
  # tag's version agrees with sdk/VERSION before either publish job does any
  # work, so a stale sdk/VERSION at tag time fails fast with one clear error
  # instead of two divergent PyPI/npm publishes.
  check:
    runs-on: ubuntu-latest
    outputs:
      publish_enabled: ${{ steps.gate.outputs.enabled }}
      is_tag: ${{ steps.gate.outputs.is_tag }}
      # should_publish is the AND of the two — informational only. The
      # publish steps in the pypi/npm jobs below do NOT trust this output
      # alone; each repeats `startsWith(github.ref, 'refs/tags/sdk-v')`
      # directly in its own `if:`, so a bug in this job's logic can't by
      # itself turn a workflow_dispatch run into a real upload. See the
      # CRITICAL fix note on those steps.
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches sdk/VERSION
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: python3 scripts/check_sdk_tag_version.py "${GITHUB_REF_NAME}"

      - name: Verify sdk/VERSION, pyproject.toml, package.json agree
        run: python3 scripts/check_sdk_versions.py

      - name: Resolve publish gate
        id: gate
        run: |
          is_tag=false
          if [[ "${GITHUB_REF}" == refs/tags/sdk-v* ]]; then
            is_tag=true
          fi
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"

          enabled=false
          if [ "${{ vars.PUBLISH_ENABLED }}" = "true" ]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

          # Real uploads require BOTH: the gate on AND this run started from
          # an sdk-v* tag push. workflow_dispatch (a branch/ref run, not a
          # tag) is ALWAYS dry-run, even with PUBLISH_ENABLED=true — a
          # manual "Run workflow" click must never be able to publish
          # whatever sdk/VERSION happens to read on main as an untagged
          # release.
          if [ "$enabled" = "true" ] && [ "$is_tag" = "true" ]; then
            echo "publish gate is ON and this run is an sdk-v* tag push — real upload steps will run"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "running in dry-run mode (build+check+install-test, no upload): PUBLISH_ENABLED=$enabled, is_tag=$is_tag"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  pypi:
    needs: check
    runs-on: ubuntu-latest
    # A GitHub Environment named "pypi-publish" — exists (with no protection
    # rules) the first time this job runs, even if nobody has configured it.
    # Configuring required reviewers on it (Settings > Environments >
    # pypi-publish > required reviewers) is a one-click, user-gated hardening
    # step layered on top of the tag+PUBLISH_ENABLED gate below — see
    # CONTRIBUTING.md's Release process.
    environment: pypi-publish
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC) even though this
      # permission is a no-op in dry-run mode — declared unconditionally so
      # the job's permission set doesn't change shape between dry-run and
      # real runs (a gate flip should never also be a permissions diff).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python3 -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python3 -m build sdk/python

      - name: twine check (validates metadata/README render before any upload)
        run: python3 -m twine check sdk/python/dist/*

      - name: Install the built wheel into a throwaway venv and import-test it
        # Runs unconditionally — dry-run or real — since it's the actual
        # proof this job's own build output installs and imports, not a
        # publish-only step.
        run: |
          python3 -m venv /tmp/offshoot-pypi-install-test
          /tmp/offshoot-pypi-install-test/bin/pip install --quiet sdk/python/dist/*.whl
          /tmp/offshoot-pypi-install-test/bin/python3 -c "import offshoot; print('import offshoot: ok')"

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        # CRITICAL fix: gated on BOTH the resolved gate output AND a direct,
        # literal re-check of the ref here — not just needs.check.outputs.
        # should_publish. A workflow_dispatch run's ref is a branch/tag
        # ref that is never refs/tags/sdk-v*, so this can never fire for a
        # manual "Run workflow" click even if PUBLISH_ENABLED is "true" and
        # even if the check job's own gating logic had a bug.
        if: needs.check.outputs.publish_enabled == 'true' && startsWith(github.ref, 'refs/tags/sdk-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

      - name: Dry-run notice
        if: needs.check.outputs.publish_enabled != 'true' || !startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          if [ "${{ needs.check.outputs.publish_enabled }}" != "true" ]; then
            echo "PUBLISH_ENABLED repository variable is not 'true' — the sdist/wheel"
            echo "above were built, twine-checked, and install-tested, but nothing was"
            echo "uploaded to PyPI. Set PUBLISH_ENABLED=true (repo Settings > Actions >"
            echo "Variables) once the offshoot-db PyPI project exists and Trusted"
            echo "Publishing is configured for this repo+workflow — see CONTRIBUTING.md."
          else
            echo "PUBLISH_ENABLED is 'true', but this run's ref (${{ github.ref }}) is not"
            echo "an sdk-v* tag — real uploads only ever happen from a tag push, never from"
            echo "workflow_dispatch, regardless of the gate. Push an sdk-v<version> tag"
            echo "(matching sdk/VERSION) to publish for real. Nothing was uploaded."
          fi

  npm:
    needs: check
    runs-on: ubuntu-latest
    # See the pypi job's identical comment above — same one-click,
    # user-gated hardening step, different environment name so PyPI and npm
    # can have different (or no) required reviewers.
    environment: npm-publish
    permissions:
      contents: read
      # id-token: write is for npm provenance's Sigstore attestation
      # (--provenance), which is independent of *registry authentication*
      # below — see the NPM_TOKEN note on the publish step.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install + build
        run: cd sdk/typescript && npm install --no-audit --no-fund && npm run build

      - name: npm pack (the exact tarball a real publish would upload)
        run: cd sdk/typescript && npm pack --pack-destination dry-run-pack

      - name: Install the packed tarball into a throwaway project and import-test it
        # Runs unconditionally — dry-run or real — same reasoning as the
        # PyPI job's install-test step above.
        run: |
          mkdir -p sdk/typescript/dry-run-install
          cd sdk/typescript/dry-run-install
          npm init -y --silent >/dev/null
          npm install --no-audit --no-fund --silent ../dry-run-pack/offshoot-db-client-*.tgz
          node -e "import('@offshoot-db/client').then((m) => { if (typeof m.connect !== 'function') throw new Error('connect export missing from published package'); console.log('import @offshoot-db/client: ok'); })"

      - name: Publish to npm (provenance)
        # CRITICAL fix: see the identical comment on the PyPI job's publish
        # step — gated on both the resolved gate output and a direct,
        # literal re-check of the ref, so a workflow_dispatch run can never
        # publish for real regardless of PUBLISH_ENABLED or a bug in the
        # check job's own logic.
        if: needs.check.outputs.publish_enabled == 'true' && startsWith(github.ref, 'refs/tags/sdk-v')
        working-directory: sdk/typescript
        run: npm publish --provenance --access public
        env:
          # Registry auth: a classic automation token in the NPM_TOKEN repo
          # secret. npm shipped OIDC-based Trusted Publishing (no long-lived
          # token) for GitHub Actions after this workflow was first written;
          # switching to it means removing NODE_AUTH_TOKEN/NPM_TOKEN here,
          # confirming the npm CLI on this runner is new enough, and
          # configuring @offshoot-db/client as a Trusted Publisher for this
          # exact repo+workflow file on npmjs.com — see CONTRIBUTING.md's
          # Release process for the up-to-date decision.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run notice
        if: needs.check.outputs.publish_enabled != 'true' || !startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          if [ "${{ needs.check.outputs.publish_enabled }}" != "true" ]; then
            echo "PUBLISH_ENABLED repository variable is not 'true' — the package above"
            echo "was built, packed, and install-tested, but nothing was uploaded to npm."
            echo "Set PUBLISH_ENABLED=true (repo Settings > Actions > Variables) once the"
            echo "@offshoot-db npm scope exists and registry auth (NPM_TOKEN secret, or"
            echo "Trusted Publishing once adopted) is configured — see CONTRIBUTING.md."
          else
            echo "PUBLISH_ENABLED is 'true', but this run's ref (${{ github.ref }}) is not"
            echo "an sdk-v* tag — real uploads only ever happen from a tag push, never from"
            echo "workflow_dispatch, regardless of the gate. Push an sdk-v<version> tag"
            echo "(matching sdk/VERSION) to publish for real. Nothing was uploaded."
          fi
