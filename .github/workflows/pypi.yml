name: pypi

# Publishes the two Python packages (sdk/python -> offshoot-db,
# sdk/python-langgraph -> langgraph-checkpoint-offshoot) to PyPI via
# Trusted Publishing (OIDC) — no long-lived tokens anywhere.
#
# Dispatch-only on purpose: SDK releases are decoupled from binary tags,
# and PyPI versions are immutable — publishing is always a deliberate act.
# Bump the `version` in the package's pyproject.toml before dispatching.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        type: choice
        required: true
        default: "both"
        options: ["both", "offshoot-db", "langgraph-checkpoint-offshoot"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build distributions
        env:
          PKG: ${{ inputs.package }}
        run: |
          python -m pip -q install build twine
          mkdir -p dist
          if [ "$PKG" = "both" ] || [ "$PKG" = "offshoot-db" ]; then
            python -m build --outdir dist sdk/python
          fi
          if [ "$PKG" = "both" ] || [ "$PKG" = "langgraph-checkpoint-offshoot" ]; then
            python -m build --outdir dist sdk/python-langgraph
          fi
          python -m twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The OIDC identity PyPI trusts is (repo, workflow pypi.yml, environment
    # pypi) — the id-token scope lives only on this job.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
