[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offshoot-db"
version = "0.1.0"
description = "Python client for offshoot: branchable SQLite for agents"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.setuptools.packages.find]
include = ["offshoot*"]
