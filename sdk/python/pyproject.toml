[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "offshoot-db"
version = "0.1.0"
description = "Python client for offshoot: branchable SQLite for agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "offshoot contributors" },
]
keywords = ["sqlite", "branching", "agents", "eval", "testing", "checkpoint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
# License classifiers are deliberately omitted: PEP 639's SPDX `license`
# string above and a `License ::` trove classifier are redundant, and recent
# setuptools treats having both as at least a deprecation warning — see
# https://peps.python.org/pep-0639/.
dependencies = []

[project.urls]
Homepage = "https://github.com/offshoot-db/offshoot"
Repository = "https://github.com/offshoot-db/offshoot"
Issues = "https://github.com/offshoot-db/offshoot/issues"
Changelog = "https://github.com/offshoot-db/offshoot/blob/main/CHANGELOG.md"
Documentation = "https://github.com/offshoot-db/offshoot/blob/main/docs/eval-harness.md"

# Reserved ahead of the pytest fixture plugin (Milestone 3 Task 4, not yet
# landed on this branch — see docs/status.md): it will be an opt-in extra,
# never a hard dependency of the base client, so `pip install offshoot-db`
# stays stdlib-only. `pip install "offshoot-db[pytest]"` will pull in pytest
# once the plugin module and its `pytest11` entry point exist; declaring the
# extra now (with no entry point yet) is harmless and keeps this manifest
# from needing another pass at publish time for that alone.
[project.optional-dependencies]
pytest = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["offshoot*"]
